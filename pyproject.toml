[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spike-ai"
version = "0.1.0"
description = "Behavior cloning AI for The Spike Cross Remaster"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "exports", "models", "data"]

[tool.ruff.lint]
# E/W: lỗi style cơ bản, F: lỗi logic (biến chưa dùng, import thừa), I: sắp xếp import,
# B: bug hay gặp (bugbear), UP: cú pháp Python hiện đại
select = ["E", "W", "F", "I", "B", "UP"]
