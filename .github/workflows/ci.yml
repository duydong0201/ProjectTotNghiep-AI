name: CI

# Chạy đúng quality gate như ở máy (scripts/check.sh) mỗi khi push hoặc mở PR vào develop/main.
# CI không có dữ liệu thật (data/ không được commit) nên chỉ chạy test trên dữ liệu giả.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint + format + test
        run: bash scripts/check.sh
