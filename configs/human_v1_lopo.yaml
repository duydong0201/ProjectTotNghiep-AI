# GĐ4 - câu hỏi (b): model có tổng quát sang NGƯỜI CHƠI MỚI không?
# Leave-one-player-out: mỗi fold bỏ ra toàn bộ dữ liệu của một người để kiểm tra.
run_name: human_v1_lopo
schema: v1
data_dirs:
  - data/raw/v1/human
agent: player
targets: [move, action]
split:
  group_by: match
  # mỗi fold = một người chơi (đọc từ cột p_player_id)
  dev_mode: lopo
  dev_ratio: 0
  holdout_ratio: 0
  # KHÔNG đổi salt sau khi đã đo trên holdout - đổi salt = đổi toàn bộ cách chia
  salt: spike-ai-split-v1
# holdout TƯƠNG LAI: các phiên chơi thu SAU khi đã chốt model (ADR-004). Chỉ đo với --final.
holdout_dirs:
  - data/raw/v1/human_holdout
seed: 42
models:
  majority: {}
  decision_tree:
    max_depth: 12
    min_samples_leaf: 10
    class_weight: balanced
  random_forest:
    n_estimators: 100
    max_depth: 14
    min_samples_leaf: 10
    class_weight: balanced
  logreg:
    class_weight: balanced
