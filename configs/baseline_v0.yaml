# GĐ1 - vòng mỏng end-to-end trên log CSV cũ (không có bóng -> model yếu là bình thường).
run_name: baseline_v0_bot
schema: v0
data_dirs:
  - data/raw/v0
# agent = nhân vật cần bắt chước: "opponent" = bot rule-based bên phải, "player" = người bên trái
agent: opponent
targets: [move, action]
split:
  group_by: match
  # 31 trận, độ dài chênh nhau 17..8187 frame -> một tập dev duy nhất bị 1 trận chiếm 78%.
  # Cross-validation 5 fold: mọi trận đều được dùng để đo đúng một lần (ADR-004)
  dev_mode: kfold
  n_folds: 5
  dev_ratio: 0
  # v0 chỉ để chạy thông pipeline, 31 trận không đủ cho một holdout có ý nghĩa (xem ADR-004)
  holdout_ratio: 0
  # KHÔNG đổi salt sau khi đã đo trên holdout - đổi salt = đổi toàn bộ cách chia
  salt: spike-ai-split-v1
seed: 42
models:
  majority: {}
  decision_tree:
    max_depth: 8
    min_samples_leaf: 20
    class_weight: balanced
  random_forest:
    n_estimators: 50
    max_depth: 10
    min_samples_leaf: 20
    class_weight: balanced
  knn:
    n_neighbors: 15
