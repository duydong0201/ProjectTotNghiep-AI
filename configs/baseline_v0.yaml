# GĐ1 - vòng mỏng end-to-end trên log CSV cũ (không có bóng -> model yếu là bình thường).
run_name: baseline_v0_bot
schema: v0
data_dirs:
  - data/raw/v0
# agent = nhân vật cần bắt chước: "opponent" = bot rule-based bên phải, "player" = người bên trái
agent: opponent
targets: [move, action]
split:
  group_by: match
  dev_ratio: 0.2
  holdout_ratio: 0.2
  # KHÔNG đổi salt sau khi đã đo trên holdout - đổi salt = đổi toàn bộ cách chia
  salt: spike-ai-split-v1
seed: 42
models:
  majority: {}
  decision_tree:
    max_depth: 8
    min_samples_leaf: 20
    class_weight: balanced
  random_forest:
    n_estimators: 50
    max_depth: 10
    min_samples_leaf: 20
    class_weight: balanced
  knn:
    n_neighbors: 15
