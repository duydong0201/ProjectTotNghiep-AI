# GĐ4 - học hành vi người chơi thật (nhân vật bên trái)
run_name: human_v1
schema: v1
data_dirs:
  - data/raw/v1/human
agent: player
targets: [move, action]
split:
  # player: mỗi người chơi nằm trọn một tập -> đo khả năng tổng quát sang người mới
  group_by: player
  dev_ratio: 0.2
  holdout_ratio: 0.2
  # KHÔNG đổi salt sau khi đã đo trên holdout - đổi salt = đổi toàn bộ cách chia
  salt: spike-ai-split-v1
seed: 42
models:
  majority: {}
  decision_tree:
    max_depth: 12
    min_samples_leaf: 10
    class_weight: balanced
  random_forest:
    n_estimators: 100
    max_depth: 14
    min_samples_leaf: 10
    class_weight: balanced
  logreg:
    class_weight: balanced
