# GĐ4 - học hành vi người chơi thật (nhân vật bên trái)
run_name: human_v1
schema: v1
data_dirs:
  - data/raw/v1/human
agent: player
targets: [move, action]
# Chỉ giữ frame trong cửa sổ +/- 20 frame quanh mỗi lần chạm bóng. Trong log v1 thật chỉ ~0,7%
# frame có hành động, phần còn lại là `None` (đứng chờ bóng): train trên toàn bộ vừa chậm vừa
# làm lớp `None` áp đảo. Cửa sổ giữ LẠI 100% mẫu hành động (PLAN.md GĐ4).
frames_around_action: 20
split:
  # câu hỏi (a): bắt chước hành vi của những người chơi đã có trong dữ liệu -> nhóm theo trận
  group_by: match
  # ít trận -> cross-validation 5 fold thay cho một tập dev duy nhất
  dev_mode: kfold
  n_folds: 5
  dev_ratio: 0
  holdout_ratio: 0
  # KHÔNG đổi salt sau khi đã đo trên holdout - đổi salt = đổi toàn bộ cách chia
  salt: spike-ai-split-v1
# holdout TƯƠNG LAI: các phiên chơi thu SAU khi đã chốt model (ADR-004). Chỉ đo với --final.
holdout_dirs:
  - data/raw/v1/human_holdout
seed: 42
models:
  majority: {}
  decision_tree:
    max_depth: 12
    min_samples_leaf: 10
    class_weight: balanced
  random_forest:
    n_estimators: 100
    max_depth: 14
    min_samples_leaf: 10
    class_weight: balanced
  logreg:
    class_weight: balanced
