# Ban v6 (22/10/2026): cau hinh nguoi dung chon (ADR-015): chuyen gia lam nguoi day + luat chan an toan +
# bot ML nhay 31,4% sau cu Set (mac dinh, khong con --jump-after-set 1.0).
# Diem nghen do o model v3: 407 diem mat vi Set xong khong nhay va khong danh tiep (69% so cu Set).
# Nen chuyen gia cung chi nhay ~31% sau Set (--expert-ground-after-set 0.686), con lai cho bong roi vua tam
# roi dap tu mat dat -> bot ML co du lieu cho dung tinh huong do.
# Dap nhanh (--expert-quick-spike) KHONG dung: do 100 tran lam chuyen gia giam 96,7% -> 82-89%.
# Xuat phat tu model v3 (dang o GeneratedAuto). Bo seed moi: 1200000 / 1300000; de danh 400000.
#
run_name: selfplay_expert_v6
schema: v1
data_dirs:
  - F:/DoAnTotNghiep/ProjectTotNghiep/Logs/v1
  - F:/DoAnTotNghiep/ProjectTotNghiep/Logs/auto
agent: [player, opponent]
targets: [action]
frames_around_action: 20
label_shift: 1

train_on_controllers: [human, expert]
agent_weight:
  opponent: 20          # frame nguoi gianh quyen DAgger nhu dagger_v1_w_aligned
controller_weight:
  expert: 2.0           # frame chuyen gia

split:
  group_by: match
  dev_mode: none        # fit 100% du lieu, ngang hang model xuat phat
  dev_ratio: 0
  holdout_ratio: 0
  salt: spike-ai-split-v1
seed: 42
models:
  random_forest:
    n_estimators: 100
    max_depth: 14
    min_samples_leaf: 10

selfplay:
  game_dir: F:/DoAnTotNghiep/ProjectTotNghiep
  runner: build/RelWithDebInfo/MatchRunner.exe
  build_dir: build
  vcvars: C:/Program Files/Microsoft Visual Studio/2022/Community/VC/Auxiliary/Build/vcvars64.bat
  auto_logs: F:/DoAnTotNghiep/ProjectTotNghiep/Logs/auto
  iterations: 10
  expert_prob: 0.5            # nua so luot cam bong do chuyen gia dieu khien khi tu choi
  matches_per_iteration: 50
  max_frames: 54000
  eval_matches: 50
  eval_seed: 1200000          # bo do chinh moi: model v3 chua tung duoc chon tren bo nay
  confirm_seed: 1300000       # bo tran xac nhan (khac bo do chinh)
  min_gain: 0.0
  keep_last_iterations: 3     # du lieu chuyen gia cua 3 vong gan nhat
  stop_after_rejections: 3
  runner_args: ["--expert-ground-after-set", "0.686"]   # bot ML nhay 31,4% (mac dinh)
